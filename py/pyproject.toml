[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "polypad-agent"
version = "2.0.1"
description = "Thin typed client for the Polypad agent API (MCP) on Robinhood Chain: prepare → sign → confirm, persistent wallet binding, and x402 pay-per-call."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
  "mcp",
  "mcp-server",
  "robinhood-chain",
  "x402",
  "ai-agents",
  "polypad",
  "claude",
  "cursor",
  "agent",
]
dependencies = [
  "requests>=2.0",
  "eth-account>=0.13",
]

[project.urls]
Homepage = "https://polypad.family/build"
Source = "https://github.com/polydash-labs/polypad-agent"
Issues = "https://github.com/polydash-labs/polypad-agent/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
