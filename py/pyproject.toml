[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "polypad-agent"
version = "2.0.0"
description = "Thin typed client for the Polypad agent API (MCP) on Robinhood Chain: prepare → sign → confirm, persistent wallet binding, and x402 pay-per-call."
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "requests>=2.0",
  "eth-account>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
